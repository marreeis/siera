  <!-- Estilo embutido: a 404 pode ser aberta em qualquer endereço do site -->
  <style>
    :root { --creme:#F4EDE8; --bordo:#4A0E25; --bordo-escuro:#350819; --lilas:#D3B6D2; --cinza:#594E52; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--creme); color: #2A1219;
      font-family: "Inter", system-ui, sans-serif; line-height: 1.6;
      display: flex; flex-direction: column; overflow-x: hidden; -webkit-font-smoothing: antialiased;
    }
    header { padding: 20px 16px; width: min(1240px, 100%); margin: 0 auto; }
    header a { display: inline-block; width: 104px; aspect-ratio: 1039 / 268; overflow: hidden; border-radius: 6px; }
    header img { width: 100%; height: auto; display: block; }
    main { flex: 1; position: relative; display: grid; place-items: center; padding: 40px 16px 80px; overflow: hidden; }
    svg.fita { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    svg.fita path { fill: none; stroke: var(--bordo); stroke-width: 26; stroke-linecap: round; vector-effect: non-scaling-stroke; opacity: .12; }
    .caixa { position: relative; text-align: center; max-width: 620px; }
    .num {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif; font-weight: 800; color: var(--bordo);
      font-size: clamp(6rem, 26vw, 13rem); line-height: .9; letter-spacing: -0.06em; margin: 0;
      display: inline-flex; align-items: flex-start; gap: .04em;
    }
    .num svg { width: .22em; height: .22em; fill: var(--lilas); margin-top: .08em; }
    h1 {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif; font-weight: 800; color: var(--bordo);
      font-size: clamp(1.7rem, 5vw, 2.6rem); letter-spacing: -0.035em; line-height: 1.1; margin: 18px 0 14px;
    }
    .marca-texto { background: linear-gradient(var(--lilas), var(--lilas)) no-repeat 0 88% / 100% .42em; padding: 0 .06em; }
    p { color: var(--cinza); margin: 0 auto 32px; max-width: 34em; }
    .acoes { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .botao {
      display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 14px 26px;
      border-radius: 999px; font-family: "Plus Jakarta Sans", system-ui, sans-serif; font-weight: 700;
      text-decoration: none; border: 1.5px solid var(--bordo); transition: background-color .3s, color .3s;
    }
    .botao--bordo { background: var(--bordo); color: var(--creme); }
    .botao--bordo:hover { background: var(--bordo-escuro); }
    .botao--contorno { color: var(--bordo); }
    .botao--contorno:hover { background: var(--bordo); color: var(--creme); }
    :focus-visible { outline: 3px solid var(--bordo); outline-offset: 3px; }
    footer { text-align: center; font-size: .85rem; color: var(--cinza); padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); }
